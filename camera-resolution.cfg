###############################################################################
# K1 camera resolution control
# Based on: https://github.com/Lamar1007/creality-k1-cam-1080p
# Local default: 1920x1080 @ 15 fps (conservative load/bitrate).
# Rollback macro: CAM_720
###############################################################################

[gcode_shell_command cam_res]
command: /bin/sh -c 'W=$1; H=$2; F=$3; ACTION=stop /usr/bin/auto_uvc.sh; killall cam_app mjpg_streamer 2>/dev/null; sleep 1; D=/dev/v4l/by-id/$(ls /dev/v4l/by-id 2>/dev/null | grep -m1 main-video); [ -e "$D" ] || D=/dev/video4; cam_app -i "$D" -t 0 -w "$W" -h "$H" -f "$F" -c </dev/null >/dev/null 2>&1 & sleep 1; LD_LIBRARY_PATH=/usr/lib/mjpg-streamer/ mjpg_streamer -i "input_memfd.so -t 0" -o "output_http.so -w /usr/share/mjpg-streamer/www/ -p 8080" </dev/null >/dev/null 2>&1 &'
timeout: 30.0
verbose: False

[gcode_macro CAM_RES]
description: Set camera resolution - CAM_RES W=1920 H=1080 FPS=15
gcode:
    {% set w = params.W|default(1920)|int %}
    {% set h = params.H|default(1080)|int %}
    {% set f = params.FPS|default(15)|int %}
    RUN_SHELL_COMMAND CMD=cam_res PARAMS="_ {w} {h} {f}"

[gcode_macro CAM_1080]
description: Camera -> 1080p @ 15 fps
gcode:
    CAM_RES W=1920 H=1080 FPS=15

[gcode_macro CAM_720]
description: Camera -> 720p @ 15 fps (stock)
gcode:
    CAM_RES W=1280 H=720 FPS=15

[delayed_gcode CAM_BOOT_DEFAULT]
initial_duration: 8
gcode:
    CAM_1080
